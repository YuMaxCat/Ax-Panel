<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131a" media="(prefers-color-scheme: dark)">
<title>维护中</title>
<!--
  样式、Logo、花瓣图形全部内联：维护态下目标站点的所有请求都会被 503 拦截，
  任何外链资源（图片 / 字体 / CSS）都会裂掉，这页必须自包含。

  Logo 由 public/logo.png 生成：居中裁正方形 → 320×320 → JPEG q88 → base64，
  换 Logo 时重跑 tools/make-maint-logo.sh 即可，不用手改下面那串 base64。
-->
<style>
  /* 主题 token 与面板主站 public/css/style.css 保持一致 */
  :root {
    color-scheme: light;

    --bg: #fdf6f9;
    --bg-a: #fffafc;

    --glass: rgba(255, 255, 255, .66);
    --glass-border: rgba(255, 255, 255, .9);

    --text: #3d3238;
    --text-2: #8d7c85;
    --text-3: #b7a7b0;

    --accent: #f2739b;
    --separator: rgba(180, 140, 160, .16);
    --shadow: 0 20px 48px -18px rgba(206, 110, 146, .34), 0 3px 10px rgba(206, 110, 146, .06);
    --glow: rgba(242, 115, 155, .30);
    --ring: rgba(255, 255, 255, .94);

    --page-bg:
      radial-gradient(126% 66% at 50% -12%, #ffe9f2 0%, rgba(255, 233, 242, 0) 62%),
      radial-gradient(104% 58% at 50% 112%, #fff0e6 0%, rgba(255, 240, 230, 0) 58%),
      var(--bg-a);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;

      --bg: #1a1519;
      --bg-a: #201a1f;

      --glass: rgba(40, 32, 38, .64);
      --glass-border: rgba(255, 190, 215, .12);

      --text: #f2e8ee;
      --text-2: #bda9b4;
      --text-3: #8a7681;

      --accent: #ff8fb1;
      --separator: rgba(255, 190, 215, .12);
      --shadow: 0 20px 48px -18px rgba(0, 0, 0, .62), 0 3px 10px rgba(0, 0, 0, .3);
      --glow: rgba(255, 143, 177, .22);
      --ring: rgba(255, 190, 215, .16);

      --page-bg:
        radial-gradient(126% 66% at 50% -12%, #2b1f29 0%, rgba(43, 31, 41, 0) 62%),
        radial-gradient(104% 58% at 50% 112%, #241a22 0%, rgba(36, 26, 34, 0) 58%),
        var(--bg-a);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--page-bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* ---------- 飘落花瓣 ---------- */
  /* 外层负责竖直下落，内层负责左右摇曳与翻转，两层周期不同步 → 轨迹自然不重复 */
  .petal {
    position: fixed;
    top: -16vh;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
    animation: petal-fall var(--dur) linear var(--delay) infinite;
  }
  .petal-i {
    display: block;
    line-height: 0;
    transform-origin: 50% 22%;
    animation: petal-sway var(--sdur) ease-in-out var(--sdelay) infinite alternate;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(var(--drift), 132vh, 0); }
  }
  @keyframes petal-sway {
    from { transform: translateX(calc(var(--amp) * -1)) rotate(var(--r1)); }
    to   { transform: translateX(var(--amp)) rotate(var(--r2)); }
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    z-index: 2;
    margin: auto;
    width: 100%;
    max-width: 392px;
    padding: 42px 32px 30px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    text-align: center;
    animation: rise .62s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(.982); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Logo ---------- */
  .avatar {
    position: relative;
    width: 116px;
    height: 116px;
    margin: 0 auto 20px;
    animation: float 6.4s ease-in-out infinite;
  }
  /* 身后一圈随主题变化的柔光，让圆形头像不孤立地贴在玻璃上 */
  .avatar::before {
    content: "";
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, rgba(255, 255, 255, 0) 70%);
  }
  .avatar img {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid var(--ring);
    box-shadow: 0 10px 24px -10px var(--glow);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .6px;
  }
  p.desc {
    margin-top: 12px;
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text-2);
  }
  .meta {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--separator);
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: .3px;
  }
  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 7px;
    vertical-align: middle;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  @media (max-width: 380px) {
    .card { padding: 36px 24px 26px; border-radius: 24px; }
    .avatar { width: 102px; height: 102px; margin-bottom: 17px; }
    h1 { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .avatar, .dot { animation: none; }
  }
</style>
</head>

<script>
  /* 飘落花瓣：纯装饰、无外部资源。
     竖直下落与左右摇曳分属两层，周期互质 → 不会出现整齐划一的机械感。 */
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var NS = 'http://www.w3.org/2000/svg';
    var PETAL_D = 'M12 23.4C7.6 18.6 3.8 13.4 3.8 8.8c0-3.6 2.4-6.2 5.1-6.2 1.5 0 2.5 1 3.1 2.3.6-1.3 1.6-2.3 3.1-2.3 2.7 0 5.1 2.6 5.1 6.2 0 4.6-3.8 9.8-8.2 14.6z';
    // 深色主题下换成更沉的粉，免得花瓣在暗底上发白刺眼
    var DARK = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var COLORS = DARK
      ? ['#8c5568', '#9d6478', '#7d4a5c', '#a87388']
      : ['#ffc6d9', '#ffd6e4', '#ffb3cd', '#ffe4ee'];

    // 三档景深：远景小而朦胧、慢；近景大而清晰、快
    var TIERS = [
      { size: 10, blur: 0.8,  opacity: .38, dur: [17, 25], sway: [4.5, 7],   amp: [7, 15],  weight: 3 },
      { size: 13, blur: 0.35, opacity: .60, dur: [13, 19], sway: [3.5, 5.5], amp: [12, 22], weight: 3 },
      { size: 17, blur: 0,    opacity: .78, dur: [10, 15], sway: [2.8, 4.6], amp: [16, 30], weight: 2 }
    ];

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function pickTier() {
      var total = 0, i;
      for (i = 0; i < TIERS.length; i++) total += TIERS[i].weight;
      var r = Math.random() * total;
      for (i = 0; i < TIERS.length; i++) { r -= TIERS[i].weight; if (r <= 0) return TIERS[i]; }
      return TIERS[TIERS.length - 1];
    }

    function build(t) {
      var wrap = document.createElement('div');
      wrap.className = 'petal';
      var inner = document.createElement('div');
      inner.className = 'petal-i';

      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', t.size);
      svg.setAttribute('height', t.size);
      svg.setAttribute('aria-hidden', 'true');
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', PETAL_D);
      path.setAttribute('fill', pick(COLORS));
      svg.appendChild(path);
      inner.appendChild(svg);
      wrap.appendChild(inner);

      var dur = rand(t.dur[0], t.dur[1]);
      var sdur = rand(t.sway[0], t.sway[1]);
      var r1 = rand(0, 200);
      var r2 = r1 + rand(120, 300) * (Math.random() < 0.5 ? -1 : 1);

      wrap.style.left = rand(0, 100).toFixed(2) + 'vw';
      wrap.style.opacity = t.opacity;
      if (t.blur) inner.style.filter = 'blur(' + t.blur + 'px)';
      wrap.style.setProperty('--dur', dur.toFixed(2) + 's');
      wrap.style.setProperty('--delay', (-rand(0, dur)).toFixed(2) + 's');
      wrap.style.setProperty('--drift', rand(-5, 5).toFixed(2) + 'vw');
      wrap.style.setProperty('--amp', rand(t.amp[0], t.amp[1]).toFixed(1) + 'px');
      wrap.style.setProperty('--sdur', sdur.toFixed(2) + 's');
      wrap.style.setProperty('--sdelay', (-rand(0, sdur)).toFixed(2) + 's');
      wrap.style.setProperty('--r1', r1.toFixed(1) + 'deg');
      wrap.style.setProperty('--r2', r2.toFixed(1) + 'deg');

      return wrap;
    }

    var count = window.innerWidth >= 700 ? 9 : 6;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++) frag.appendChild(build(pickTier()));
    document.body.appendChild(frag);
  })();
